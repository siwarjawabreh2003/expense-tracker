<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-secondary">
  <div class="container">
    <span class=" navbar-brand mb-0 h1">Expense Tracker</span>
   
  </div>
</nav>

<main class="container py-4">

  <div id="alertContainer"></div>

  
  <div id="loading" class="text-center d-none my-4">
    <div class="spinner-border" role="status">
    </div>
  </div>

<div class="summary-grid mb-4">
<div>
        <div class="card">
        <div class="card-body">
          <h5 class="card-title">Total Amount</h5>
          <p id="totalAmount" class="card-text">0</p>
        </div>
      </div>
    </div>
  <div>
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Number of Expenses</h5>
          <p id="expenseCount" class="card-text">0</p>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Highest Expense</h5>
          <p id="highestExpense" class="card-text">0</p>
        </div>
      </div>
    </div>

  </div>

  <div class="card mb-4">
    <div class="card-body">

      <h5 class="card-title">Add Expense</h5>

      <form id="expenseForm" class="row g-3">

        <div class="col-md-3">
          <label for="title" class="form-label">Title</label>
          <input
            type="text"
            class="form-control"
            id="title"
            required
          >
        </div>

        <div class="col-md-3">
          <label for="amount" class="form-label">Amount</label>
          <input
            type="number"
            class="form-control"
            id="amount"
            min="0.01"
            step="0.01"
            required
          >
        </div>

        <div class="col-md-3">
          <label for="category" class="form-label">Category</label>

          <select id="category" class="form-select" required>
            <option value="">Choose...</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="col-md-3">
          <label for="date" class="form-label">Date</label>
          <input
            type="date"
            class="form-control"
            id="date"
            required
          >
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-secondary">
            Add Expense
          </button>
        </div>

      </form>

    </div>
  </div>

  <div class="mb-3">
    <label for="categoryFilter" class="form-label">
      Filter by Category
    </label>

    <select id="categoryFilter" class="form-select">
      <option value="All">All</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Bills">Bills</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <div class="table-responsive">

    <table class="table table-striped text-nowrap">

      <thead>
        <tr class="border border-black">
          <th class="bg-secondary">Title</th>
          <th class="bg-secondary">Amount</th>
          <th class="bg-secondary">Category</th>
          <th class="bg-secondary">Date</th>
          <th class="bg-secondary">Actions</th>
        </tr>
      </thead>

      <tbody id="expenseTableBody">
      </tbody>

    </table>

  </div>

</main>

<div class="modal fade" id="editModal" >

  <div class="modal-dialog">
    <div class="modal-content">

      
      <div class="modal-header">
        <h5 class="modal-title">Edit Expense</h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal">
        </button>
      </div>

      <div class="modal-body">

        <form id="editForm">

          <div class="mb-3">
            <label for="editTitle" class="form-label">Title</label>
            <input
              type="text"
              id="editTitle"
              class="form-control"
              required
            >
          </div>

          <div class="mb-3">
            <label for="editAmount" class="form-label">Amount</label>
            <input
              type="number"
              id="editAmount"
              class="form-control"
              min="0.01"
              step="0.01"
              required
            >
          </div>

          <div class="mb-3">
            <label for="editCategory" class="form-label">Category</label>

            <select id="editCategory" class="form-select" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="editDate" class="form-label">Date</label>
            <input
              type="date"
              id="editDate"
              class="form-control"
              required
            >
          </div>

        </form>

      </div>

      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal">
          Cancel
        </button>

        <button
          type="submit"
          form="editForm"
          class="btn btn-primary">
          Save Changes
        </button>

      </div>

    </div>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
